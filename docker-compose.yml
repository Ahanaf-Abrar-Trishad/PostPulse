version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: socialintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./:/app
    command: ["python", "-m", "app.main", "run-daily"]

volumes:
  pgdata:
